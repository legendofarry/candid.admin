[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/owner"
  to = "/.netlify/functions/owner-api/api/owner"
  status = 200
  force = true

[[redirects]]
  from = "/api/owner/*"
  to = "/.netlify/functions/owner-api/api/owner/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
